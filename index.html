function confirmDel(btn,cb){
  if(btn._c){cb();return;}
  btn._c=true; const orig=btn.textContent;
  btn.textContent='✓?'; btn.style.cssText+=';color:#e07070;border-color:#e07070';
  btn.onclick=()=>{btn._ok=true;cb();};
  setTimeout(()=>{if(!btn._ok){btn._c=false;btn.textContent=orig;btn.style.color='';btn.style.borderColor='';btn.onclick=()=>confirmDel(btn,cb);}},3000);
}

function downloadICS(pair, dateObj) {
  const formatICS = (dt) => dt.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const start = formatICS(dateObj);
  const end   = formatICS(new Date(dateObj.getTime() + 30 * 60000));
  const uid   = `rose-aligner-${pair}-${dateObj.getTime()}@rose.planner`;

  // Раньше не хватало PRODID / UID / DTSTAMP и строки склеивались через \n —
  // часть календарей из-за этого отказывалась открывать файл.
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Rose Planner//Aligners//RU',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${formatICS(new Date())}`,
    `DTSTART:${start}`,
    `DTEND:${end}`,
    `SUMMARY:Смена элайнеров — пара ${pair}`,
    `DESCRIPTION:Пора надеть пару ${pair}. Почисти зубы и промой капы.`,
    'BEGIN:VALARM',
    'TRIGGER:-PT2H',
    'ACTION:DISPLAY',
    'DESCRIPTION:Через 2 часа менять элайнеры',
    'END:VALARM',
    'BEGIN:VALARM',
    'TRIGGER:PT0M',
    'ACTION:DISPLAY',
    'DESCRIPTION:Пора менять элайнеры!',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aligners_pair_${pair}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ═══════════════════════════════════
   APP CORE
═══════════════════════════════════ */
const TABS = ['finance','shopping','goals','aligners','cycles','stats'];

class App {
  constructor(){
    this.db = new DB();
    this.tab = 'finance';
    this.statsStart = null; this.statsEnd = null;
    this._swipeDir = null;
    this._incFilter = 'month';
    this._incCustomS = null; this._incCustomE = null;
    this._incOpen = false;
    this._schedShowAll = false;
    this.db.ready.then(()=>this._init()).catch(e=>console.error('[Rosé]',e));
  }
  
  async _init(){
    // Браузер не должен сам восстанавливать скролл — мы делаем это точнее
    if('scrollRestoration' in history) history.scrollRestoration = 'manual';

    document.getElementById('tabs').addEventListener('click',e=>{
      const tabEl = e.target.closest('.tab');
      const t = tabEl && tabEl.dataset.tab;
      if(!t||t===this.tab) return;
      const oi=TABS.indexOf(this.tab),ni=TABS.indexOf(t);
      this._swipeDir=ni>oi?'left':'right';
      this.tab=t;
      document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
      this._scrollTab(t);
      this._render();
    });

    document.getElementById('exp-btn').onclick=()=>this._export();
    document.getElementById('imp-file').onchange=e=>this._import(e.target.files[0]);
    this._initSwipe();
    this._render();

    // Разрешение на уведомления просим только после первого касания:
    // iOS игнорирует запрос без жеста пользователя.
    const askOnce = () => {
      document.removeEventListener('click', askOnce);
      this._requestNotifPerms();
    };
    document.addEventListener('click', askOnce, {once:true});

    if ('serviceWorker' in navigator) {
      // scope:'/' ломался, если приложение лежит в подпапке (GitHub Pages и т.п.)
      navigator.serviceWorker.register('sw.js')
        .then(() => {
          navigator.serviceWorker.addEventListener('message', event => {
            if (event.data && event.data.action === 'backup-now') this._export(true);
          });
        })
        .catch(err => console.warn('SW failed', err));
    }

    // Если приложение висело в фоне и наступил новый день — пересчитываем
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState !== 'visible') return;
      const t = today();
      if(this._lastDay && this._lastDay !== t) this._render();
      this._lastDay = t;
    });
    this._lastDay = today();
  }

  async _requestNotifPerms(){
    try{
      if(!('Notification' in window)) return false;
      if(Notification.permission!=='default') return Notification.permission==='granted';
      const p = await Notification.requestPermission();
      return p==='granted';
    }catch(e){ return false; }
  }

  async _getAlignerSchedule() {
    const overrides = (await this.db.cfg('alignerOverrides')) || {};
    const intervalDays = Number(await this.db.cfg('alignerIntervalDays')) || 14;
    const intervalMs = intervalDays * 86400000;
    const maxPair = Math.max(ALIGNER_UPPER_TOTAL, ALIGNER_LOWER_TOTAL);

    // битые значения игнорируем, иначе весь график превращался в Invalid Date
    const ov = n => {
      const raw = overrides[n] ?? overrides[String(n)];
      if(!raw) return null;
      const d = new Date(raw);
      return isNaN(d.getTime()) ? null : d;
    };

    const schedule = [];
    let lastDate = ov(1) || new Date("2026-03-12T22:00:00");

    for (let n = 1; n <= maxPair; n++) {
      const fixed = ov(n);
      const d = fixed ? fixed : (n > 1 ? new Date(lastDate.getTime() + intervalMs) : lastDate);
      schedule.push({ pair: n, date: d, manual: !!fixed });
      lastDate = d;
    }
    return schedule;
  }

  _getAlignerStatus(schedule) {
    const now = new Date();
    let wearingPair = 1, wearingEntry = schedule[0];
    
    for (const s of schedule) {
      if (now >= s.date) { wearingPair = s.pair; wearingEntry = s; }
    }
    
    const nextPair  = wearingPair + 1;
    const nextEntry = schedule.find(s => s.pair === nextPair) || null;
    const btnAvailAt = nextEntry ? new Date(nextEntry.date.getTime() - ALIGNER_BTN_LEAD_MS) : null;
    const isBtnVisible = btnAvailAt ? now >= btnAvailAt : false;
    const isOverdue    = nextEntry ? now > nextEntry.date : false;
    
    let msTillNext = nextEntry ? nextEntry.date - now : null;
    if (msTillNext !== null && msTillNext < 0) msTillNext = 0;
    
    const daysLeft  = msTillNext !== null ? Math.max(0, Math.floor(msTillNext/86400000)) : null;
    const hoursLeft = msTillNext !== null ? Math.max(0, Math.floor((msTillNext%86400000)/3600000)) : null;
    const minsLeft  = msTillNext !== null ? Math.max(0, Math.floor((msTillNext%3600000)/60000)) : null;
    
    return { wearingPair, wearingEntry, nextPair, nextEntry, isBtnVisible, isOverdue, daysLeft, hoursLeft, minsLeft };
  }

  _scrollTab(t){
    const el=document.querySelector(`.tab[data-tab="${t}"]`);
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }
  _initSwipe(){
    const el=document.getElementById('app-content');
    let sx=0,sy=0,moved=false;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;},{passive:true});
    el.addEventListener('touchmove',e=>{const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);if(dx>dy&&dx>10)moved=true;},{passive:true});
    el.addEventListener('touchend',e=>{
      if(!moved)return;
      const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4)return;
      const cur=TABS.indexOf(this.tab);let next=-1;
      if(dx<0&&cur<TABS.length-1)next=cur+1;
      if(dx>0&&cur>0)next=cur-1;
      if(next<0)return;
      this._swipeDir=dx<0?'left':'right';
      this.tab=TABS[next];
      document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===this.tab));
      this._scrollTab(this.tab); this._render();
    },{passive:true});
  }
  
  /* Перерисовка страницы.
     Главный фикс: раньше любое нажатие пересобирало DOM и экран отбрасывало наверх.
     Теперь позиция скролла и открытые «details» сохраняются. */
  async _render(opts = {}){
    const isTabSwitch = !!this._swipeDir;
    const keepScroll  = opts.toTop ? false : !isTabSwitch;
    const sy = window.scrollY || window.pageYOffset || 0;

    const c=document.getElementById('app-content');
    // Минимальная высота на время перерисовки — чтобы страница не «схлопнулась» и скролл не слетел
    if(keepScroll) c.style.minHeight = c.offsetHeight + 'px';
    c.innerHTML='';
    const wrap=document.createElement('div');
    if(this._swipeDir==='left') wrap.className='page-in-l';
    else if(this._swipeDir==='right') wrap.className='page-in-r';
    this._swipeDir=null; c.appendChild(wrap);
    const map={
      finance:()=>this._finance(wrap),
      shopping:()=>this._shopping(wrap),
      goals:()=>this._goals(wrap),
      aligners:()=>this._aligners(wrap),
      cycles:()=>this._cycles(wrap),
      stats:()=>this._stats(wrap)
    };
    try { await (map[this.tab]||map.finance)(); }
    catch(err){ console.error('[Rosé] render',err); }

    this._restoreDetails(wrap);
    c.style.minHeight = '';

    if(keepScroll){
      const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
      const target = Math.min(sy, maxY);
      window.scrollTo(0, target);
      requestAnimationFrame(()=>window.scrollTo(0, Math.min(sy, Math.max(0, document.documentElement.scrollHeight - window.innerHeight))));
    } else {
      window.scrollTo(0,0);
    }
  }

  /* Запоминаем, какие раскрывающиеся блоки открыты, чтобы они не захлопывались */
  _restoreDetails(root){
    if(!this._openDetails) this._openDetails = new Set();
    root.querySelectorAll('details[data-dk]').forEach(d=>{
      if(this._openDetails.has(d.dataset.dk)) d.open = true;
      d.addEventListener('toggle', ()=>{
        if(d.open) this._openDetails.add(d.dataset.dk);
        else this._openDetails.delete(d.dataset.dk);
      });
    });
  }
  _card(extra=''){const el=document.createElement('div');el.className='card'+extra;return el;}

  /* Ненавязчивое уведомление вместо alert() — alert на iOS блокирует всё окно */
  _toast(msg){
    const t = document.getElementById('toast');
    if(!t){ console.log(msg); return; }
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(()=>t.classList.remove('on'), 2100);
  }

  /* ═══════════════════════════════════
     CYCLES — ЖЕНСКИЙ КАЛЕНДАРЬ
  ═══════════════════════════════════ */

  /* --- Загрузка и нормализация данных --- */
  async _cycleData(){
    let cycles = await this.db.all(S.CYCLES);
    // выбрасываем битые записи, приводим формат, сортируем свежие сверху
    cycles = cycles
      .filter(c => c && /^\d{4}-\d{2}-\d{2}$/.test(c.startDate || ''))
      .map(c => ({...c, endDate: /^\d{4}-\d{2}-\d{2}$/.test(c.endDate || '') ? c.endDate : null}))
      .sort((a,b) => b.startDate.localeCompare(a.startDate));

    // если конец раньше начала — чиним на лету
    cycles.forEach(c => { if(c.endDate && c.endDate < c.startDate) c.endDate = c.startDate; });

    const symptoms = await this.db.all(S.SYMPTOMS);
    const sMap = {};
    symptoms.forEach(s => {
      if(!s || !s.date) return;
      if(!Array.isArray(s.tags)) s.tags = [];
      sMap[s.date] = s;
    });
    return { cycles, symptoms, sMap };
  }

  /* --- Статистика по истории --- */
  _cycleStats(cycles){
    // длины циклов = расстояние между началами соседних месячных
    const lens = [];
    for(let i = 0; i < cycles.length - 1; i++){
      const d = dDiff(dParse(cycles[i].startDate), dParse(cycles[i+1].startDate));
      if(d >= 15 && d <= 60) lens.push(d); // явные опечатки игнорируем
    }
    const recent = lens.slice(0, 6); // считаем по последним 6 циклам — так точнее
    const avgCycle = recent.length
      ? Math.min(45, Math.max(20, Math.round(recent.reduce((a,b)=>a+b,0) / recent.length)))
      : 28;
    const minLen = recent.length ? Math.min(...recent) : null;
    const maxLen = recent.length ? Math.max(...recent) : null;
    const spread = recent.length > 1 ? maxLen - minLen : null;

    // длительность кровотечения — только по закрытым записям
    const durs = [];
    cycles.forEach(c => {
      if(!c.endDate) return;
      const d = dDiff(dParse(c.endDate), dParse(c.startDate)) + 1;
      if(d >= 1 && d <= 14) durs.push(d);
    });
    const rd = durs.slice(0, 6);
    const avgDur = rd.length
      ? Math.min(12, Math.max(2, Math.round(rd.reduce((a,b)=>a+b,0) / rd.length)))
      : 5;

    let regularity = null;
    if(spread !== null){
      if(spread <= 3)      regularity = {l:'Регулярный',   e:'💚', c:'var(--green)', d:'Цикл стабильный, прогноз точный'};
      else if(spread <= 7) regularity = {l:'Почти ровный', e:'💛', c:'var(--peach)', d:'Небольшой разброс — это нормально'};
      else                 regularity = {l:'Плавающий',    e:'🩷', c:'var(--lilac)', d:'Разброс большой, прогноз примерный'};
    }

    return { avgCycle, avgDur, minLen, maxLen, spread, regularity,
             samples: recent.length, durSamples: rd.length, known: recent.length > 0 };
  }

  /* --- Где мы находимся прямо сейчас --- */
  _cycleState(cycles, stats){
    const todayD = today();
    const now = dParse(todayD);
    const st = { now, todayD, cur:null, cDay:0, phase:'none', bleeding:false,
                 delay:0, unclosed:false, daysToNext:null, preds:[], bleedEnd:null };

    // текущий цикл — последний, начавшийся не позже сегодняшнего дня
    const cur = cycles.find(c => c.startDate <= todayD) || null;
    if(!cur) return st;

    st.cur = cur;
    const start = dParse(cur.startDate);
    st.cDay = dDiff(now, start) + 1;

    if(cur.endDate){
      st.bleeding = todayD <= cur.endDate;
      st.bleedEnd = dParse(cur.endDate);
    } else {
      // Раньше было так: нет даты окончания → «менструация» навсегда.
      // Теперь предполагаем среднюю длительность и мягко напоминаем закрыть запись.
      const assumed = Math.max(stats.avgDur, 3);
      st.bleeding  = st.cDay <= assumed;
      st.unclosed  = st.cDay > assumed + 1;
      st.bleedEnd  = dAdd(start, assumed - 1);
    }

    const A = stats.avgCycle;
    for(let i = 1; i <= 9; i++){
      const ps = dAdd(start, A * i);
      const ov = dAdd(ps, -14);
      st.preds.push({
        start: ps,
        end:   dAdd(ps, stats.avgDur - 1),
        ovu:   ov,
        fertS: dAdd(ov, -5),
        fertE: dAdd(ov,  1),
        pmsS:  dAdd(ps, -5),
        pmsE:  dAdd(ps, -1)
      });
    }

    const p0 = st.preds[0];
    st.next       = p0;
    st.daysToNext = dDiff(p0.start, now);
    st.delay      = Math.max(0, -st.daysToNext);

    if(st.bleeding)                                 st.phase = 'menses';
    else if(st.delay > 0)                           st.phase = 'delay';
    else if(dDiff(now, p0.ovu) === 0)               st.phase = 'ovu';
    else if(now >= p0.fertS && now <= p0.fertE)     st.phase = 'fertile';
    else if(now >= p0.pmsS)                         st.phase = 'pms';
    else if(now <  p0.fertS)                        st.phase = 'follicular';
    else                                            st.phase = 'luteal';

    return st;
  }

  /* --- Главный рендер вкладки --- */
  async _cycles(c){
    const { cycles, sMap } = await this._cycleData();
    const stats = this._cycleStats(cycles);
    const st    = this._cycleState(cycles, stats);
    this._cyc   = { cycles, sMap, stats, st };

    // день, за который редактируем самочувствие (по умолчанию — сегодня, в будущее нельзя)
    if(!this._sympDate || this._sympDate > st.todayD) this._sympDate = st.todayD;

    this._cycHero(c);
    this._cycSymptoms(c);

    const calBox = document.createElement('div');
    c.appendChild(calBox);
    this._calBox = calBox;
    this._renderCalendar();

    this._cycForecast(c);
    this._cycStats(c);
    this._cycInsights(c);
    this._cycGuide(c);
    this._cycHistory(c);
  }

  /* --- Карточка №1: кольцо, фаза, быстрые кнопки --- */
  _cycHero(c){
    const { stats, st } = this._cyc;
    const ph = PHASES[st.phase] || PHASES.none;
    const card = this._card(' pink-card');

    let ring;
    if(st.cur){
      const pct = st.phase === 'delay' ? 100 : Math.max(4, Math.min(100, (st.cDay / stats.avgCycle) * 100));
      const bigNum = st.phase === 'delay' ? `+${st.delay}` : st.cDay;
      const sub = st.phase === 'delay'
        ? `задержка ${days(st.delay)}`
        : (st.daysToNext === 0 ? 'месячные ждём сегодня'
          : `до месячных ~${days(st.daysToNext)}`);
      ring = `
        <div class="cycle-ring-wrap" style="border-color:${ph.c}33">
          <svg viewBox="0 0 36 36" style="position:absolute;width:100%;height:100%;transform:rotate(-90deg)" aria-hidden="true">
            <path d="M18 2.0845a15.9155 15.9155 0 0 1 0 31.831a15.9155 15.9155 0 0 1 0-31.831"
                  fill="none" stroke="var(--bg2)" stroke-width="3"/>
            <path d="M18 2.0845a15.9155 15.9155 0 0 1 0 31.831a15.9155 15.9155 0 0 1 0-31.831"
                  fill="none" stroke="${ph.c}" stroke-width="3" stroke-linecap="round"
                  stroke-dasharray="${pct.toFixed(1)} 100"/>
          </svg>
          <div class="cycle-ring-inner">
            <div class="cycle-ring-day" style="color:${ph.c}">${bigNum}<span style="font-size:15px;letter-spacing:0"> ${st.phase==='delay'?plural(st.delay,'день','дня','дней'):'день'}</span></div>
            <div class="cycle-ring-phase" style="color:${ph.c}">${ph.e} ${ph.l}</div>
            <div class="cycle-ring-sub">${sub}</div>
          </div>
        </div>`;
    } else {
      ring = `<div style="text-align:center;padding:26px 10px;color:var(--muted);font-weight:700;line-height:1.7">
                <div style="font-size:40px;margin-bottom:8px">🌸</div>
                Отметь первый день месячных —<br>и я посчитаю всё остальное сама
              </div>`;
    }

    // кнопки быстрых действий
    let acts = '';
    if(st.cur && !st.cur.endDate && st.bleeding){
      acts = `<button class="qa-btn end" data-act="end">🛑 Закончились сегодня</button>`;
    } else if(st.cur && st.cur.startDate === st.todayD){
      acts = `<button class="qa-btn end" data-act="end">🛑 Закончились сегодня</button>`;
    } else {
      acts = `<button class="qa-btn start" data-act="start">🩸 Начались сегодня!</button>`;
    }
    acts += `<div class="qa-hint">Начались не сегодня? Нажми нужный день в календаре 👇</div>`;

    // предупреждение о незакрытой записи
    let warn = '';
    if(st.unclosed){
      warn = `<div class="notify-box warn" style="margin-bottom:12px">
        ⚠️ Ты не отметила, когда месячные закончились (идут уже ${days(st.cDay)}).
        <div class="btn-row" style="margin-top:8px">
          <button class="btn p2" data-act="end-guess">Закончились ${dShort(st.bleedEnd)}</button>
          <button class="btn p2" data-act="end">Закончились сегодня</button>
        </div>
      </div>`;
    } else if(st.phase === 'delay' && st.delay >= 3){
      warn = `<div class="notify-box warn" style="margin-bottom:12px">
        ⏳ Задержка ${days(st.delay)}. Чаще всего виноваты стресс, недосып, болезнь или смена режима.
        Если больше недели — имеет смысл сделать тест и сходить к врачу 💗
      </div>`;
    }

    const stripe = stats.known
      ? `<div style="display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:14px;text-align:center">
           <span style="white-space:nowrap">ЦИКЛ ~${stats.avgCycle} ДН.</span>
           <span style="white-space:nowrap">КРОВЬ ~${stats.avgDur} ДН.</span>
           ${stats.regularity ? `<span style="white-space:nowrap;color:${stats.regularity.c}">${stats.regularity.e} ${stats.regularity.l.toUpperCase()}</span>` : ''}
         </div>`
      : `<div style="text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);margin-bottom:14px">
           ПОКА СЧИТАЮ ПО СРЕДНИМ: 28 / 5 ДН.
         </div>`;

    card.innerHTML = `<div class="card-title">🌸 Мой цикл</div>${ring}${stripe}${warn}${acts}`;
    c.appendChild(card);

    card.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]');
      if(!b) return;
      const act = b.dataset.act;
      if(act === 'start')          await this._cycStart(st.todayD);
      else if(act === 'end')       await this._cycEnd(st.todayD);
      else if(act === 'end-guess') await this._cycEnd(dKey(st.bleedEnd));
    });

    // подсказка по текущей фазе
    if(st.cur && ph.tip){
      const tip = this._card();
      tip.style.borderLeft = `4px solid ${ph.c}`;
      tip.innerHTML = `<div style="font-size:12px;font-weight:900;color:${ph.c};margin-bottom:6px">${ph.e} ${ph.l.toUpperCase()} — ЧТО ЭТО ЗНАЧИТ</div>
        <div style="font-size:12.5px;line-height:1.7;color:var(--text2);font-weight:600">${ph.tip}</div>`;
      c.appendChild(tip);
    }
  }

  /* --- Карточка №2: самочувствие за выбранный день --- */
  _cycSymptoms(c){
    const card = this._card(' lilac-card');
    card.id = 'symp-card';
    this._sympCard = card;
    c.appendChild(card);
    this._paintSympCard();
  }

  _paintSympCard(){
    const card = this._sympCard;
    if(!card) return;
    const { sMap, st } = this._cyc;
    const key = this._sympDate;
    const d   = dParse(key);
    const rec = sMap[key] || { date:key, flow:'', pain:'', mood:'', tags:[], note:'' };
    const isToday = key === st.todayD;
    const label = isToday ? 'Сегодня' : d.toLocaleDateString('ru-RU',{weekday:'short', day:'numeric', month:'long'});
    const canFwd = key < st.todayD;

    card.innerHTML = `
      <div class="card-title">☁️ Как ты себя чувствуешь?</div>
      <div class="day-pick">
        <button class="mini-btn" data-nav="-1">‹</button>
        <div class="day-pick-lbl">${esc(label)}</div>
        <div style="display:flex;gap:6px">
          ${isToday ? '' : '<button class="mini-btn" data-nav="today">Сегодня</button>'}
          <button class="mini-btn" data-nav="1" ${canFwd ? '' : 'disabled style="opacity:.35"'}>›</button>
        </div>
      </div>
      ${this._sympGroupsHTML(rec)}
      <div style="font-size:10px;color:var(--muted);font-weight:700;text-align:center;margin-top:4px">
        Сохраняется само, сразу ✨
      </div>`;

    card.querySelectorAll('[data-nav]').forEach(b => {
      b.onclick = () => {
        const v = b.dataset.nav;
        if(v === 'today') this._sympDate = st.todayD;
        else {
          const n = dAdd(dParse(this._sympDate), Number(v));
          if(dKey(n) > st.todayD) return;
          this._sympDate = dKey(n);
        }
        this._paintSympCard();      // перерисовываем только карточку — страница не дёргается
        this._markSelectedDay();
      };
    });

    this._wireSympEditor(card, key);
  }

  /* --- Разметка групп чипов (используется и в карточке, и в окне дня) --- */
  _sympGroupsHTML(rec){
    const tags = Array.isArray(rec.tags) ? rec.tags : [];
    const grp = (title, id, opts, sel, multi) => `
      <div class="symp-group">
        <div class="symp-title">${title}</div>
        <div class="symp-chips" data-grp="${id}" data-multi="${multi ? 1 : 0}">
          ${opts.map(o => `<div class="symp-chip${(multi ? tags.includes(o.id) : sel === o.id) ? ' active' : ''}" data-val="${o.id}">${o.e} ${o.l}</div>`).join('')}
        </div>
      </div>`;
    return grp('🩸 Выделения', 'flow', FLOW_OPTS, rec.flow, false)
         + grp('⚡ Боль и спазмы', 'pain', PAIN_OPTS, rec.pain, false)
         + grp('🎭 Настроение', 'mood', MOOD_OPTS, rec.mood, false)
         + grp('💭 Что ещё чувствуешь', 'tags', TAG_OPTS, null, true)
         + `<div class="symp-group">
              <div class="symp-title">📝 Заметка</div>
              <textarea data-note rows="2" placeholder="Всё, что хочется запомнить..." style="resize:vertical">${esc(rec.note || '')}</textarea>
            </div>`;
  }

  /* --- Обработчики чипов: мгновенно, без перерисовки страницы --- */
  _wireSympEditor(root, key){
    const getRec = () => {
      const r = this._cyc.sMap[key] || { date:key, flow:'', pain:'', mood:'', tags:[], note:'' };
      if(!Array.isArray(r.tags)) r.tags = [];
      return r;
    };
    const save = async rec => {
      const empty = !rec.flow && !rec.pain && !rec.mood && !rec.tags.length && !(rec.note || '').trim();
      if(empty){
        delete this._cyc.sMap[key];
        try { await this.db.del(S.SYMPTOMS, key); } catch(e){}
      } else {
        this._cyc.sMap[key] = rec;
        await this.db.set(S.SYMPTOMS, rec);
      }
      this._paintDayCell(key);
    };

    root.querySelectorAll('.symp-chips').forEach(box => {
      const grp = box.dataset.grp, multi = box.dataset.multi === '1';
      box.querySelectorAll('.symp-chip').forEach(chip => {
        chip.onclick = async () => {
          const rec = getRec(), val = chip.dataset.val;
          if(multi){
            const i = rec.tags.indexOf(val);
            if(i >= 0){ rec.tags.splice(i,1); chip.classList.remove('active'); }
            else { rec.tags.push(val); chip.classList.add('active'); }
          } else if(rec[grp] === val){
            rec[grp] = '';
            chip.classList.remove('active');
          } else {
            rec[grp] = val;
            box.querySelectorAll('.symp-chip').forEach(x => x.classList.remove('active'));
            chip.classList.add('active');
          }
          await save(rec);
        };
      });
    });

    const ta = root.querySelector('[data-note]');
    if(ta){
      let t;
      ta.oninput = () => {
        clearTimeout(t);
        t = setTimeout(async () => { const rec = getRec(); rec.note = ta.value; await save(rec); }, 400);
      };
    }
  }

  /* --- Эмодзи для клетки календаря --- */
  _dayEmojis(rec){
    if(!rec) return '';
    let s = '';
    if(rec.flow && FLOW_MAP[rec.flow])                        s += FLOW_MAP[rec.flow].e;
    if(rec.pain && rec.pain !== 'none' && PAIN_MAP[rec.pain]) s += PAIN_MAP[rec.pain].e;
    if(rec.mood && MOOD_MAP[rec.mood])                        s += MOOD_MAP[rec.mood].e;
    if(rec.tags && rec.tags.length && TAG_MAP[rec.tags[0]])   s += TAG_MAP[rec.tags[0]].e;
    return [...s].slice(0, 3).join('');
  }

  /* Обновляем эмодзи в одной клетке, не трогая остальное */
  _paintDayCell(key){
    if(!this._calBox) return;
    const cell = this._calBox.querySelector(`[data-day="${key}"]`);
    if(!cell) return;
    const old = cell.querySelector('.cal-emoji-list');
    if(old) old.remove();
    const e = this._dayEmojis(this._cyc.sMap[key]);
    if(e) cell.insertAdjacentHTML('beforeend', `<div class="cal-emoji-list">${e}</div>`);
  }

  _markSelectedDay(){
    if(!this._calBox) return;
    this._calBox.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
    const cell = this._calBox.querySelector(`[data-day="${this._sympDate}"]`);
    if(cell) cell.classList.add('selected');
  }

  /* --- Календарь --- */
  _renderCalendar(){
    const box = this._calBox;
    if(!box) return;
    const { cycles, sMap, stats, st } = this._cyc;

    if(!this._cycView) this._cycView = new Date(st.now.getFullYear(), st.now.getMonth(), 1);
    const cy = this._cycView.getFullYear(), cm = this._cycView.getMonth();
    const daysInMo = new Date(cy, cm + 1, 0).getDate();
    const firstDay = (new Date(cy, cm, 1).getDay() + 6) % 7; // неделя с понедельника
    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

    // реальные месячные: незакрытый цикл не закрашиваем в будущее
    const inActual = d => cycles.some(c => {
      const s = dParse(c.startDate);
      let e;
      if(c.endDate) e = dParse(c.endDate);
      else {
        const guess = dAdd(s, stats.avgDur - 1);
        e = guess > st.now ? st.now : guess;
      }
      return d >= s && d <= e;
    });

    let html = `
      <div class="cal-wrap">
        <div class="cal-hdr">
          <button class="cal-btn" data-mo="-1" aria-label="Предыдущий месяц">‹</button>
          <span>${MONTHS[cm]} ${cy}</span>
          <button class="cal-btn" data-mo="1" aria-label="Следующий месяц">›</button>
        </div>
        <div class="cal-grid">
          <div class="cal-day-hdr">Пн</div><div class="cal-day-hdr">Вт</div><div class="cal-day-hdr">Ср</div>
          <div class="cal-day-hdr">Чт</div><div class="cal-day-hdr">Пт</div>
          <div class="cal-day-hdr" style="color:var(--pink-l)">Сб</div><div class="cal-day-hdr" style="color:var(--pink-l)">Вс</div>`;

    const prevMoDays = new Date(cy, cm, 0).getDate();
    for(let i = 0; i < firstDay; i++)
      html += `<div class="cal-day other-mo">${prevMoDays - firstDay + i + 1}</div>`;

    for(let d = 1; d <= daysInMo; d++){
      const cur = new Date(cy, cm, d);
      const key = dKey(cur);
      const cls = ['cal-day'];

      if(key === st.todayD) cls.push('today');
      if(key === this._sympDate) cls.push('selected');
      if(key > st.todayD) cls.push('fut');

      const actual = inActual(cur);
      const pred   = !actual && st.preds.some(p => cur >= p.start && cur <= p.end);
      const fert   = !actual && !pred && st.preds.some(p => cur >= p.fertS && cur <= p.fertE);
      const pms    = !actual && !pred && !fert && st.preds.some(p => cur >= p.pmsS && cur <= p.pmsE);
      const ovu    = st.preds.some(p => dDiff(cur, p.ovu) === 0);

      if(actual)    cls.push('period');
      else if(pred) cls.push('period-pred');
      else if(fert) cls.push('fertile');
      else if(pms)  cls.push('pms');
      if(ovu && !actual && !pred) cls.push('ovu');

      const icon = actual ? '🩸' : (ovu ? '✨' : '');
      const em = this._dayEmojis(sMap[key]);

      html += `<div class="${cls.join(' ')}" data-day="${key}">${d}`
            + (icon ? `<span class="cal-icon">${icon}</span>` : '')
            + (em ? `<div class="cal-emoji-list">${em}</div>` : '')
            + `</div>`;
    }

    const rem = (firstDay + daysInMo) % 7 === 0 ? 0 : 7 - ((firstDay + daysInMo) % 7);
    for(let i = 1; i <= rem; i++) html += `<div class="cal-day other-mo">${i}</div>`;

    html += `</div>
        <div class="cal-legend">
          <span><div class="dot d-period"></div> Месячные</span>
          <span><div class="dot d-pred"></div> Прогноз</span>
          <span><div class="dot d-fert"></div> Фертильные (✨ овуляция)</span>
          <span><div class="dot d-pms"></div> ПМС</span>
        </div>
      </div>
      <div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;margin:-6px 0 14px">
        Нажми на любой день, чтобы отметить месячные или самочувствие
      </div>`;

    box.innerHTML = html;

    box.querySelectorAll('[data-mo]').forEach(b => {
      b.onclick = () => {
        this._cycView = new Date(cy, cm + Number(b.dataset.mo), 1);
        this._renderCalendar();  // перерисовываем только календарь
      };
    });
    box.querySelectorAll('.cal-day[data-day]').forEach(cell => {
      cell.onclick = () => this._openDaySheet(cell.dataset.day);
    });
  }

  /* --- Окно конкретного дня --- */
  _openDaySheet(key){
    const { cycles, sMap, st } = this._cyc;
    const d = dParse(key);
    const isFuture = key > st.todayD;

    const startsHere = cycles.find(c => c.startDate === key);
    const owner = cycles.find(c => {
      if(c.startDate > key) return false;
      if(c.endDate) return key <= c.endDate;
      return true;   // открытая запись
    });
    const insidePeriod = !!cycles.find(c => c.startDate <= key && c.endDate && key <= c.endDate) || !!startsHere;

    let acts = '';
    if(isFuture){
      acts = `<div class="notify-box info" style="margin-bottom:10px">🔮 Это будущий день — отметить можно только когда он наступит.</div>`;
    } else {
      if(startsHere){
        acts += `<button class="btn p2 full" data-act="del-start">🗑 Убрать «месячные начались»</button>`;
      } else if(!insidePeriod){
        acts += `<button class="btn p full" data-act="set-start">🩸 Месячные начались в этот день</button>`;
      }
      if(owner && owner.startDate < key && (!owner.endDate || owner.endDate !== key)){
        acts += `<button class="btn p2 full" data-act="set-end">🛑 Закончились в этот день</button>`;
      }
      if(owner && owner.endDate === key){
        acts += `<button class="btn p2 full" data-act="reopen">↩️ Ещё не закончились</button>`;
      }
    }

    const rec = sMap[key] || { date:key, flow:'', pain:'', mood:'', tags:[], note:'' };
    const back = document.createElement('div');
    back.className = 'sheet-back';
    back.innerHTML = `
      <div class="sheet">
        <div class="sheet-grab"></div>
        <div class="sheet-hdr">
          <div class="sheet-ttl">${esc(d.toLocaleDateString('ru-RU',{weekday:'long', day:'numeric', month:'long'}))}</div>
          <button class="sheet-x" data-close>✕</button>
        </div>
        ${acts}
        ${isFuture ? '' : `<div style="margin-top:14px">${this._sympGroupsHTML(rec)}</div>`}
      </div>`;
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';

    const close = () => { back.remove(); document.body.style.overflow = ''; };
    back.addEventListener('click', async e => {
      if(e.target === back || e.target.closest('[data-close]')) { close(); return; }
      const b = e.target.closest('[data-act]');
      if(!b) return;
      const act = b.dataset.act;
      close();
      if(act === 'set-start')      await this._cycStart(key);
      else if(act === 'set-end')   await this._cycEnd(key);
      else if(act === 'del-start'){ await this.db.del(S.CYCLES, startsHere.id); this._toast('Отметка убрана'); this._render(); }
      else if(act === 'reopen'){    owner.endDate = null; await this.db.set(S.CYCLES, owner); this._toast('Записала: ещё идут'); this._render(); }
    });

    if(!isFuture){
      this._wireSympEditor(back, key);
      // после закрытия окна карточка внизу должна показывать тот же день
      back.querySelectorAll('.symp-chip, [data-note]').forEach(el => {
        el.addEventListener('click', () => { this._sympDate = key; });
      });
    }
  }

  /* --- Операции с записями цикла --- */
  async _cycStart(key){
    const { cycles } = this._cyc;
    if(cycles.some(c => c.startDate === key)){ this._toast('Этот день уже отмечен 🌸'); return; }
    // если попадаем внутрь уже отмеченного периода — не плодим дубли
    if(cycles.some(c => c.endDate && c.startDate < key && key <= c.endDate)){
      this._toast('Этот день уже внутри месячных');
      return;
    }
    // закрываем предыдущую незакрытую запись, чтобы не было наложений
    const prev = cycles.find(c => c.startDate < key && !c.endDate);
    if(prev){
      prev.endDate = dKey(dAdd(dParse(key), -1));
      if(prev.endDate < prev.startDate) prev.endDate = prev.startDate;
      await this.db.set(S.CYCLES, prev);
    }
    await this.db.add(S.CYCLES, { startDate: key, endDate: null });
    this._toast('Отметила начало 🩸');
    this._render();
  }

  async _cycEnd(key){
    const { cycles } = this._cyc;
    const cur = cycles.find(c => c.startDate <= key && (!c.endDate || c.endDate >= key));
    if(!cur){ this._toast('Сначала отметь начало'); return; }
    if(key < cur.startDate){ this._toast('Конец не может быть раньше начала'); return; }
    cur.endDate = key;
    await this.db.set(S.CYCLES, cur);
    this._toast('Отметила окончание ✨');
    this._render();
  }

  /* --- Прогноз --- */
  _cycForecast(c){
    const { st, stats } = this._cyc;
    if(!st.cur) return;
    const card = this._card();
    const p0 = st.preds[0];
    const rows = [];

    if(st.delay > 0){
      rows.push({ e:'⏳', bg:'rgba(224,112,112,.12)', t:'Месячные ожидались',
                  s:`${dShort(p0.start)} · задержка ${days(st.delay)}`, b:'сейчас' });
    } else {
      rows.push({ e:'🩸', bg:'rgba(232,116,154,.12)', t:'Следующие месячные',
                  s:`${dShort(p0.start)} — ${dShort(p0.end)}`,
                  b: st.daysToNext === 0 ? 'сегодня' : `через ${days(st.daysToNext)}` });
    }

    const nextFert = st.preds.find(p => p.fertE >= st.now);
    if(nextFert){
      const dd = dDiff(nextFert.ovu, st.now);
      rows.push({ e:'✨', bg:'rgba(212,160,199,.15)', t:'Фертильное окно',
                  s:`${dShort(nextFert.fertS)} — ${dShort(nextFert.fertE)}, овуляция ${dShort(nextFert.ovu)}`,
                  b: dd === 0 ? 'сегодня' : (dd > 0 ? `через ${days(dd)}` : 'идёт') });
    }

    const nextPms = st.preds.find(p => p.pmsE >= st.now);
    if(nextPms){
      const dd = dDiff(nextPms.pmsS, st.now);
      rows.push({ e:'🌧', bg:'rgba(255,181,167,.18)', t:'Возможный ПМС',
                  s:`${dShort(nextPms.pmsS)} — ${dShort(nextPms.pmsE)}`,
                  b: dd <= 0 ? 'идёт' : `через ${days(dd)}` });
    }

    const after = st.preds.slice(1, 4)
      .map(p => dShort(p.start)).join(' · ');

    card.innerHTML = `<div class="card-title">🔮 Что дальше</div>
      ${rows.map(r => `
        <div class="fc-row">
          <div class="fc-ic" style="background:${r.bg}">${r.e}</div>
          <div style="min-width:0;flex:1"><div class="fc-t">${r.t}</div><div class="fc-s">${r.s}</div></div>
          <div class="fc-badge">${r.b}</div>
        </div>`).join('')}
      <div style="font-size:10px;color:var(--muted);font-weight:700;margin-top:10px;line-height:1.6">
        Дальше по плану: ${after}<br>
        ${stats.known
          ? `Прогноз построен по твоим последним ${stats.samples} ${plural(stats.samples,'циклу','циклам','циклам')}.`
          : 'Прогноз пока по средним значениям — отметь ещё пару циклов, и он станет точным.'}
      </div>`;
    c.appendChild(card);
  }

  /* --- Цифры --- */
  _cycStats(c){
    const { cycles, stats, st } = this._cyc;
    if(!cycles.length) return;
    const card = this._card(' mint-card');
    card.innerHTML = `<div class="card-title">📈 Твои цифры</div>
      <div class="g3">
        <div class="stat"><div class="v">${stats.avgCycle}</div><div class="l">Средний цикл</div></div>
        <div class="stat"><div class="v">${stats.avgDur}</div><div class="l">Дней крови</div></div>
        <div class="stat"><div class="v">${cycles.length}</div><div class="l">Записей</div></div>
      </div>
      ${stats.spread !== null ? `
        <div class="phase-bar" style="margin-top:14px">
          <i style="flex:${stats.avgDur};background:linear-gradient(90deg,var(--pink),#d95e86)"></i>
          <i style="flex:${Math.max(1, stats.avgCycle - 14 - stats.avgDur - 2)};background:rgba(109,191,141,.5)"></i>
          <i style="flex:6;background:rgba(212,160,199,.6)"></i>
          <i style="flex:${Math.max(1, 14 - 5)};background:rgba(255,181,167,.55)"></i>
          <i style="flex:5;background:rgba(255,181,167,.85)"></i>
        </div>
        <div class="phase-marks"><span>🩸 Месячные</span><span>🌱 Фолл.</span><span>✨ Овул.</span><span>☁️ Лют.</span><span>🌧 ПМС</span></div>
        <div style="margin-top:12px;font-size:11.5px;font-weight:700;color:var(--text2);line-height:1.6">
          ${stats.regularity.e} <b style="color:${stats.regularity.c}">${stats.regularity.l}</b> — ${stats.regularity.d}.<br>
          ${stats.spread === 0 ? `Все последние циклы ровно по ${days(stats.minLen)}.` : `Разброс: от ${days(stats.minLen)} до ${days(stats.maxLen)}.`}
        </div>` : `
        <div style="margin-top:12px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.6">
          Отметь ещё ${cycles.length < 2 ? 'один цикл' : 'пару циклов'} — и я покажу, насколько он регулярный 💗
        </div>`}`;
    c.appendChild(card);
  }

  /* --- Что чаще всего беспокоит --- */
  _cycInsights(c){
    const { sMap } = this._cyc;
    const recs = Object.values(sMap);
    if(recs.length < 4) return;

    const count = {};
    recs.forEach(r => (r.tags || []).forEach(t => { count[t] = (count[t] || 0) + 1; }));
    const moodCount = {};
    recs.forEach(r => { if(r.mood) moodCount[r.mood] = (moodCount[r.mood] || 0) + 1; });

    const top = Object.entries(count).sort((a,b) => b[1] - a[1]).slice(0, 5);
    if(!top.length && !Object.keys(moodCount).length) return;

    const max = top.length ? top[0][1] : 1;
    const topMood = Object.entries(moodCount).sort((a,b) => b[1] - a[1])[0];

    const card = this._card();
    card.innerHTML = `<div class="card-title">🔍 Что повторяется</div>
      <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px">
        По ${recs.length} ${plural(recs.length,'отмеченному дню','отмеченным дням','отмеченным дням')}
      </div>
      ${top.map(([id, n]) => `
        <div class="insight-row">
          <span style="width:120px;flex-shrink:0">${TAG_MAP[id] ? TAG_MAP[id].e + ' ' + TAG_MAP[id].l : esc(id)}</span>
          <div class="insight-bar"><i style="width:${Math.round(n / max * 100)}%"></i></div>
          <span style="width:28px;text-align:right;color:var(--pink);font-weight:900">${n}</span>
        </div>`).join('')}
      ${topMood && MOOD_MAP[topMood[0]] ? `
        <div style="margin-top:10px;font-size:11.5px;font-weight:700;color:var(--text2)">
          Чаще всего настроение: ${MOOD_MAP[topMood[0]].e} <b>${MOOD_MAP[topMood[0]].l.toLowerCase()}</b> (${topMood[1]} ${plural(topMood[1],'день','дня','дней')})
        </div>` : ''}`;
    c.appendChild(card);
  }

  /* --- Памятка --- */
  _cycGuide(c){
    const g = document.createElement('details');
    g.className = 'notify-box info';
    g.dataset.dk = 'cyc-guide';
    g.style.cssText = 'background:var(--bg2);border-color:var(--border2);margin-bottom:14px';
    g.innerHTML = `
      <summary>❓ Как это работает и что отмечать?</summary>
      <div style="font-size:12px;margin-top:10px;line-height:1.7;color:var(--text2);font-weight:600">
        <b>Цикл</b> — время от первого дня одних месячных до первого дня следующих.<br><br>
        <b>Что нужно делать:</b><br>
        1. Нажимать <b>«Начались сегодня»</b> и <b>«Закончились сегодня»</b>.<br>
        2. Забыла в тот день? Нажми нужную дату в календаре — там всё можно поправить.<br>
        3. По желанию — отмечать самочувствие. Чем чаще, тем полезнее раздел «Что повторяется».<br><br>
        <b>Фазы:</b><br>
        🩸 <b>Менструация</b> — организм обновляется, нормально хотеть отдыхать.<br>
        🌱 <b>Фолликулярная</b> — энергия растёт, лучшее время для дел и спорта.<br>
        ✨ <b>Овуляция</b> — пик энергии и фертильности.<br>
        ☁️ <b>Лютеиновая</b> — энергия плавно падает, хочется уюта.<br>
        🌧 <b>ПМС</b> — последние ~5 дней перед месячными, настроение может скакать.<br><br>
        <i>Прогноз — это математика по твоей истории, а не диагноз. Он не заменяет врача и не годится как способ контрацепции 🌸</i>
      </div>`;
    c.appendChild(g);
  }

  /* --- История и ручное управление --- */
  _cycHistory(c){
    const { cycles, st } = this._cyc;
    const card = this._card();
    card.innerHTML = `<details data-dk="cyc-manual">
      <summary>✏️ Ручное управление датами</summary>
      <div class="g2" style="margin-top:10px">
        <div class="ig"><label class="lbl">Начались</label><input type="date" id="cyc-start" value="${st.todayD}" max="${st.todayD}"></div>
        <div class="ig"><label class="lbl">Закончились</label><input type="date" id="cyc-end" max="${st.todayD}"></div>
      </div>
      <button class="btn p full" id="cyc-add-manual">Сохранить запись 💾</button>
      <div class="card-title" style="margin-top:16px;font-size:14px">📜 История (${cycles.length})</div>
      <div id="cyc-hist-list"></div>
    </details>`;
    c.appendChild(card);

    card.querySelector('#cyc-add-manual').onclick = async () => {
      const s = card.querySelector('#cyc-start').value;
      const e = card.querySelector('#cyc-end').value || null;
      if(!s){ this._toast('Укажи дату начала'); return; }
      if(s > st.todayD){ this._toast('Нельзя отметить будущее'); return; }
      if(e && s > e){ this._toast('Конец раньше начала 🤔'); return; }
      if(cycles.some(c2 => c2.startDate === s)){ this._toast('Такая запись уже есть'); return; }
      await this.db.add(S.CYCLES, { startDate: s, endDate: e });
      this._toast('Сохранила 💾');
      this._render();
    };

    const list = card.querySelector('#cyc-hist-list');
    if(!cycles.length){
      list.innerHTML = '<div style="color:var(--muted);text-align:center;padding:14px;font-weight:600">Записей пока нет ✨</div>';
      return;
    }

    cycles.forEach((cyc, idx) => {
      const durStr = cyc.endDate
        ? days(dDiff(dParse(cyc.endDate), dParse(cyc.startDate)) + 1)
        : 'идут сейчас';
      let lenStr = '—';
      if(idx < cycles.length - 1){
        lenStr = `цикл ${days(dDiff(dParse(cyc.startDate), dParse(cycles[idx+1].startDate)))}`;
      }
      const row = document.createElement('div');
      row.className = 'log-row';
      row.style.flexWrap = 'wrap';
      row.innerHTML = `
        <div style="min-width:0;flex:1">
          <div style="font-weight:800;color:var(--text)">${dStr(cyc.startDate)} — ${cyc.endDate ? dStr(cyc.endDate) : '...'}</div>
          <div class="log-meta">Кровь: ${durStr} · ${lenStr}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="mini-btn" data-edit="${cyc.id}">✏️</button>
          <button class="del-btn" data-del="${cyc.id}">×</button>
        </div>
        <div data-ed="${cyc.id}" style="display:none;width:100%;margin-top:8px">
          <div class="g2">
            <div class="ig"><label class="lbl">Начались</label><input type="date" data-s="${cyc.id}" value="${cyc.startDate}" max="${st.todayD}"></div>
            <div class="ig"><label class="lbl">Закончились</label><input type="date" data-e="${cyc.id}" value="${cyc.endDate || ''}" max="${st.todayD}"></div>
          </div>
          <button class="btn p2 full" data-save="${cyc.id}" style="margin-top:0">Сохранить</button>
        </div>`;

      row.querySelector(`[data-edit="${cyc.id}"]`).onclick = () => {
        const ed = row.querySelector(`[data-ed="${cyc.id}"]`);
        ed.style.display = ed.style.display === 'none' ? 'block' : 'none';
      };
      row.querySelector(`[data-save="${cyc.id}"]`).onclick = async () => {
        const s = row.querySelector(`[data-s="${cyc.id}"]`).value;
        const e = row.querySelector(`[data-e="${cyc.id}"]`).value || null;
        if(!s){ this._toast('Нужна дата начала'); return; }
        if(e && s > e){ this._toast('Конец раньше начала 🤔'); return; }
        await this.db.set(S.CYCLES, { ...cyc, startDate: s, endDate: e });
        this._toast('Обновила ✨');
        this._render();
      };
      row.querySelector(`[data-del="${cyc.id}"]`).onclick = e => {
        confirmDel(e.target, async () => {
          e.target._ok = true;
          await this.db.del(S.CYCLES, cyc.id);
          this._render();
        });
      };
      list.appendChild(row);
    });
  }


  /* ═══ SHOPPING LIST ═══ */
  async _shopping(c) {
    const items = await this.db.all(S.SHOP);
    const toBuy = items.filter(i => !i.isAtHome && !i.isBought);
    const bought = items.filter(i => !i.isAtHome && i.isBought);
    const atHome = items.filter(i => i.isAtHome);

    const addCard = this._card(' lilac-card');
    addCard.innerHTML = `
      <div class="card-title">📝 Что нужно?</div>
      <div class="search-row">
        <input type="text" id="shop-text" placeholder="Название (напр. Молоко, Паста...)">
      </div>
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
        <div style="display:flex; align-items:center; gap:4px;">
          <span style="font-size:11px; font-weight:700; color:var(--muted)">Кол-во:</span>
          <input type="number" id="shop-qty" value="1" min="1" style="width:60px; padding:8px;">
        </div>
        <label style="font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--text2)">
          <input type="checkbox" id="shop-home" style="width:16px;height:16px;"> Уже есть дома
        </label>
        <label style="font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--pink)">
          <input type="checkbox" id="shop-req" style="width:16px;height:16px;"> ⭐ Обязательно
        </label>
      </div>
      <button class="btn p full" id="shop-add">Добавить в список ✨</button>
    `;
    c.appendChild(addCard);

    addCard.querySelector('#shop-add').onclick = async () => {
      const text = addCard.querySelector('#shop-text').value.trim();
      if (!text) return;
      const isAtHome = addCard.querySelector('#shop-home').checked;
      const isMandatory = addCard.querySelector('#shop-req').checked;
      const qty = parseInt(addCard.querySelector('#shop-qty').value) || 1;
      
      await this.db.add(S.SHOP, { 
        text, 
        isAtHome, 
        isMandatory, 
        isBought: false,
        quantity: qty,
        dateAdded: new Date().toISOString()
      });
      this._render();
    };

    const renderList = (listTitle, listArray, isToBuyMode = false, isAtHomeMode = false) => {
      if(listArray.length === 0) return '';
      let html = `<div style="margin-top:16px"><div style="font-size:12px; font-weight:800; color:var(--text2); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;">${listTitle} (${listArray.length})</div>`;
      listArray.sort((a,b) => (b.isMandatory ? 1 : 0) - (a.isMandatory ? 1 : 0)).forEach(item => {
        const qty = item.quantity || 1;
        const classes = ['shop-item'];
        if(isToBuyMode) classes.push('needed');
        if(item.isBought) classes.push('bought');
        if(item.isMandatory) classes.push('mandatory');

        html += `
          <div class="${classes.join(' ')}" data-id="${item.id}">
            <div class="shop-content">
              ${isToBuyMode || item.isBought ? `<div class="shop-check ${item.isBought ? 'checked' : ''}" data-action="toggle-buy" data-id="${item.id}">${item.isBought ? '✓' : ''}</div>` : ''}
              <div style="flex:1; min-width:0;">
                <div class="shop-text">${esc(item.text)} ${qty > 1 ? `<span style="font-weight:800; color:var(--pink-d);">x${qty}</span>` : ''}</div>
                ${item.isMandatory ? `<div class="shop-meta">⭐ Обязательно</div>` : ''}
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
              ${!item.isBought ? `<div class="qty-ctrl">
                <button data-action="qty-dec" data-id="${item.id}">−</button>
                <span class="qty-val">${qty}</span>
                <button data-action="qty-inc" data-id="${item.id}">+</button>
              </div>` : `<span style="font-size:12px; color:var(--muted);">x${qty}</span>`}
              <button class="btn p2" style="padding:4px 8px; font-size:10px; border-radius:10px; white-space:nowrap;" data-action="toggle-home" data-id="${item.id}">${item.isAtHome ? 'Закончилось' : 'Куплено'}</button>
              <button class="del-btn" data-action="del" data-id="${item.id}">×</button>
            </div>
          </div>
        `;
      });
      html += '</div>';
      return html;
    };

    if(toBuy.length > 0 || bought.length > 0 || atHome.length > 0) {
      const listCard = this._card(' pink-card');
      listCard.innerHTML = `
        <div class="card-title">🛍 Мои списки</div>
        ${renderList('🛒 Надо купить', toBuy, true)}
        ${renderList('✅ В корзине (куплено)', bought, true)}
        ${renderList('🏠 Есть дома', atHome, false, true)}
      `;
      c.appendChild(listCard);

      listCard.addEventListener('click', async (e) => {
        const btn = e.target.closest('button') || e.target.closest('.shop-check');
        if(!btn) return;
        const action = btn.dataset.action;
        const id = Number(btn.dataset.id);
        const item = await this.db.get(S.SHOP, id);
        if(!item) return;

        if (action === 'del') {
          confirmDel(btn, async () => { await this.db.del(S.SHOP, id); this._render(); });
        } else if (action === 'toggle-buy') {
          item.isBought = !item.isBought; await this.db.set(S.SHOP, item); this._render();
        } else if (action === 'toggle-home') {
          item.isAtHome = !item.isAtHome; if(item.isAtHome) item.isBought = false; await this.db.set(S.SHOP, item); this._render();
        } else if (action === 'qty-inc') {
          item.quantity = (item.quantity || 1) + 1; await this.db.set(S.SHOP, item); this._render();
        } else if (action === 'qty-dec') {
          const newQty = (item.quantity || 1) - 1;
          if (newQty <= 0) await this.db.del(S.SHOP, id);
          else { item.quantity = newQty; await this.db.set(S.SHOP, item); }
          this._render();
        }
      });
    }
  }

  /* ═══ FINANCE ═══ */
  async _finance(c){
    const balance=await this.db.cfg('balance');
    const budgetCap=await this.db.cfg('monthlyBudgetCap');
    const txs=await this.db.all(S.TX);
    const goals=(await this.db.all(S.GOALS)).filter(g=>g.active);
    const now=new Date(), todayStr=today();
    const mStart=new Date(now.getFullYear(),now.getMonth(),1);
    const dInM=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const dRem=Math.max(1,dInM-now.getDate()+1);

    const isGoal=t=>t.type==='expense'&&t.category==='Цель';
    const spentMonth=txs.filter(t=>t.type==='expense'&&new Date(t.date)>=mStart&&!isGoal(t)).reduce((s,t)=>s+t.amount,0);
    const todaySpent=txs.filter(t=>t.type==='expense'&&t.date.startsWith(todayStr)&&!isGoal(t)).reduce((s,t)=>s+t.amount,0);

    const budRem=Math.max(0,budgetCap-(spentMonth-todaySpent));
    const dailyBudget=budRem/dRem;
    const remainToday=dailyBudget-todaySpent;
    const exceeded=remainToday<0;
    const freeCash=Math.max(0,balance-budRem);

    const balCard = this._card(' pink-card');
    const bCol = balance <= 0 ? 'bad' : balance < budRem ? 'warn' : 'ok';
    balCard.innerHTML = `<div class="card-title">💳 Мой баланс</div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div class="big ${bCol}">${fmt(balance)} ₽</div>
        <button class="btn p2" id="set-bal">✏ Изменить</button>
      </div>
      ${exceeded ? `<div class="reminder" style="margin-top:10px">⚠️ Сегодняшний лимит превышен на ${fmt(Math.abs(remainToday))} ₽</div>` : ''}
      ${freeCash > 500 ? `<div class="free-cash">✨ Свободных денег: <b>${fmt(freeCash)} ₽</b> — можно на цели!</div>` : ''}
      <div id="bal-ed"></div>
      <div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--border2)">
        <div style="display:flex; justify-content:space-between; align-items:center;">
         <div style="font-size:12px; font-weight:800; color:var(--text2)">💰 Доходы: <span id="income-total-amount" style="color:var(--green); font-weight:900">+${fmt(txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0))} ₽</span></div>
          <button class="btn p2" id="inc-toggle" style="padding:5px 14px; font-size:10px">${this._incOpen ? '▲ Свернуть' : '▼ Развернуть'}</button>
        </div>
        <div id="income-panel" style="display:${this._incOpen ? 'block' : 'none'}; margin-top:8px"></div>
      </div>`;
    c.appendChild(balCard);

    this._renderIncomePanel(balCard.querySelector('#income-panel'), txs);

    balCard.querySelector('#inc-toggle').onclick = () => {
      this._incOpen = !this._incOpen;
      balCard.querySelector('#inc-toggle').textContent = this._incOpen ? '▲ Свернуть' : '▼ Развернуть';
      const panel = balCard.querySelector('#income-panel');
      panel.style.display = this._incOpen ? 'block' : 'none';
      if (this._incOpen) this._renderIncomePanel(panel, txs);
    };

    balCard.querySelector('#set-bal').onclick = () => {
      const ed = balCard.querySelector('#bal-ed');
      if (ed.innerHTML) { ed.innerHTML = ''; return; }
      ed.innerHTML = `<div style="display:flex;gap:8px;margin-top:12px"><input type="number" id="bi" step="0.01" value="${balance}" style="flex:1"><button class="btn p" id="bs">OK ✓</button></div>`;
      ed.querySelector('#bs').onclick = async () => { const v = parseFloat(ed.querySelector('#bi').value); if (!isNaN(v)) { await this.db.setCfg('balance', v); this._render(); } };
    };

    const dayCol=remainToday<0?'var(--red)':remainToday<200?'var(--peach)':'var(--green)';
    const budCard=this._card();
    budCard.innerHTML=`<div class="card-title">📊 Бюджет месяца</div>
      <div class="b-row"><div class="b-key">Остаток на сегодня</div><div class="b-val" style="color:${dayCol}">${fmt(remainToday)} ₽ <span style="opacity:.5;font-size:10px">/ ${fmt(dailyBudget)}</span></div></div>
      <div class="b-row"><div class="b-key">Потрачено сегодня</div><div class="b-val">${fmt(todaySpent)} ₽</div></div>
      <div class="b-row"><div class="b-key">За этот месяц</div><div class="b-val" style="color:${spentMonth>budgetCap?'var(--red)':'var(--pink-d)'}">${fmt(spentMonth)} / ${fmtI(budgetCap)} ₽</div></div>
      <details data-dk="bud-settings"><summary>⚙ Настройки бюджета</summary>
        <div class="ig" style="margin-top:8px"><label class="lbl">Бюджет на месяц (₽)</label><input type="number" id="budcap" value="${budgetCap}"></div>
        <button class="btn p full" id="bud-save">Сохранить 💾</button>
      </details>`;
    c.appendChild(budCard);
    budCard.querySelector('#bud-save').onclick=async()=>{
      const cap=parseFloat(budCard.querySelector('#budcap').value);
      if(cap>0){await this.db.setCfg('monthlyBudgetCap',cap);this._render();}
    };

    if(goals.length){
      const gCard=this._card(' lilac-card');
      gCard.innerHTML='<div class="card-title">🎯 Мои цели</div>';
      [...goals].sort((a,b)=>(a.priority||2)-(b.priority||2)).forEach(goal=>{
        const saved=txs.filter(t=>t.type==='expense'&&t.category==='Цель'&&t.comment===goal.name).reduce((s,t)=>s+t.amount,0);
        const tgt=Number(goal.targetAmount)||0;
        const pct=tgt>0?Math.min(100,(saved/tgt)*100):0;
        const left=Math.max(0,tgt-saved);
        const dLeft=Math.ceil((new Date(goal.deadline)-now)/86400000);
        const col=goal.color||'#e8749a';
        gCard.insertAdjacentHTML('beforeend',`<div class="goal-mini">
          <div class="goal-mini-title"><span style="color:${col}">${esc(goal.name)}</span><span style="font-size:10px;color:var(--muted)">${pct.toFixed(0)}% · ост. ${fmt(left)} ₽${dLeft>0?' · '+dLeft+' дн.':' · ⏰'}</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:linear-gradient(90deg,${col}88,${col})"></div></div>
        </div>`);
      });
      c.appendChild(gCard);
    }

    const txCard=this._card();
    const allGoals=(await this.db.all(S.GOALS)).filter(g=>g.active);
    txCard.innerHTML=`<div class="card-title">➕ Новая запись</div>
      <div class="ig"><label class="lbl">Тип</label><select id="tx-type"><option value="expense">Расход 💸</option><option value="income">Доход 💰</option></select></div>
      <div class="g2">
        <div class="ig"><label class="lbl">Сумма (₽)</label><input type="number" id="tx-amt" placeholder="0.00" step="0.01"></div>
        <div class="ig"><label class="lbl">Категория</label><select id="tx-cat"></select></div>
      </div>
      <div class="g2">
        <div class="ig"><label class="lbl">Дата</label><input type="date" id="tx-date" value="${todayStr}"></div>
        <div class="ig"><label class="lbl">Комментарий</label><input type="text" id="tx-comment" placeholder="Необязательно"></div>
      </div>
      <button class="btn p full" id="tx-add">Добавить ✓</button>`;
    c.appendChild(txCard);
    const typeEl=txCard.querySelector('#tx-type'), catEl=txCard.querySelector('#tx-cat');
    const fillCats=()=>{
      if(typeEl.value==='income'){catEl.innerHTML=CAT_INC.map(x=>`<option value="${x}">${x}</option>`).join('');}
      else{
        let html=CAT_EXP.map(x=>`<option value="${x}">${x}</option>`).join('');
        if(allGoals.length){html+='<option disabled>── Копим на ──</option>';allGoals.forEach(g=>{html+=`<option value="ЦЕЛЬ:${esc(g.name)}">🎯 ${esc(g.name)}</option>`;});}
        catEl.innerHTML=html;
      }
    };
    fillCats(); typeEl.onchange=fillCats;
    txCard.querySelector('#tx-add').onclick=async()=>{
      const amt=parseFloat(txCard.querySelector('#tx-amt').value);
      if(!amt||amt<=0) return;
      const type=typeEl.value; let cat=catEl.value, comment=txCard.querySelector('#tx-comment').value.trim();
      const dt=txCard.querySelector('#tx-date').value||todayStr;
      if(cat.startsWith('ЦЕЛЬ:')){comment=cat.substring(5);cat='Цель';}
      await this.db.add(S.TX,{amount:amt,type,category:cat,comment,date:new Date(dt+'T12:00:00').toISOString()});
      let bal=await this.db.cfg('balance');
      await this.db.setCfg('balance',type==='income'?bal+amt:bal-amt);
      txCard.querySelector('#tx-amt').value=''; txCard.querySelector('#tx-comment').value='';
      this._render();
    };

    const sorted=[...txs].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const histCard=this._card();
    histCard.innerHTML=`<div class="card-title">📋 История</div>
      <div class="search-row"><input type="text" id="tx-q" placeholder="🔍 Поиск..."><select id="tx-fc"><option value="">Все</option>${[...CAT_EXP,...CAT_INC,'Цель'].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>
      <div id="tx-list"></div>`;
    c.appendChild(histCard);
    const renderList=(q='',fc='')=>{
      let fil=sorted;
      if(q) fil=fil.filter(t=>(t.comment||'').toLowerCase().includes(q)||t.category.toLowerCase().includes(q));
      if(fc) fil=fil.filter(t=>t.category===fc);
      const listEl=histCard.querySelector('#tx-list'); listEl.innerHTML='';
      if(!fil.length){listEl.innerHTML='<div style="color:var(--muted);text-align:center;padding:16px;font-weight:600">Записей нет ✨</div>';return;}
      fil.slice(0,30).forEach(tx=>{

        row.querySelector('div:last-child').appendChild(del);
        del.onclick=()=>confirmDel(del,async()=>{del._ok=true;await this.db.del(S.TX,tx.id);let bal=await this.db.cfg('balance');await this.db.setCfg('balance',tx.type==='income'?bal-tx.amount:bal+tx.amount);this._render();});
        listEl.appendChild(row);
      });

    renderList();
    let st; histCard.querySelector('#tx-q').oninput=e=>{clearTimeout(st);st=setTimeout(()=>renderList(e.target.value.toLowerCase(),histCard.querySelector('#tx-fc').value),200);};
    histCard.querySelector('#tx-fc').onchange=e=>renderList(histCard.querySelector('#tx-q').value.toLowerCase(),e.target.value);
  }

  _renderIncomePanel(panel, txs) {
    const now = new Date();
    const f = this._incFilter || 'month';
    let s0, e0;
    if (f === 'today') { s0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()); e0 = new Date(s0.getTime() + 86400000 - 1); }
    else if (f === 'month') { s0 = new Date(now.getFullYear(), now.getMonth(), 1); e0 = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59); }
    else if (f === 'year') { s0 = new Date(now.getFullYear(), 0, 1); e0 = new Date(now.getFullYear(), 11, 31, 23, 59, 59); }
    else if (f === 'all') { s0 = new Date(0); e0 = new Date(9999, 0, 1); }
    else if (f === 'custom' && this._incCustomS && this._incCustomE) { s0 = new Date(this._incCustomS + 'T00:00:00'); e0 = new Date(this._incCustomE + 'T23:59:59'); }
    else { s0 = new Date(now.getFullYear(), now.getMonth(), 1); e0 = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59); }

    const incTxs = txs.filter(t => { const d = new Date(t.date); return t.type === 'income' && d >= s0 && d <= e0; });
    const total = incTxs.reduce((s, t) => s + t.amount, 0);

    const incomeSpan = document.getElementById('income-total-amount');
    if (incomeSpan) incomeSpan.innerHTML = `+${fmt(total)} ₽`;

    const chips = [{ id: 'today', l: 'Сегодня' }, { id: 'month', l: 'Месяц' }, { id: 'year', l: 'Год' }, { id: 'all', l: 'Всё время' }, { id: 'custom', l: 'Свой период' }];
    let html = `<div class="filter-chips">${chips.map(ch => `<div class="chip${f === ch.id ? ' on' : ''}" data-f="${ch.id}">${ch.l}</div>`).join('')}</div>`;
    if (f === 'custom') html += `<div class="custom-dates"><input type="date" id="ics" value="${this._incCustomS || today()}"><input type="date" id="ice" value="${this._incCustomE || today()}"></div>`;
    panel.innerHTML = html;

    panel.querySelectorAll('.chip').forEach(el => {
      el.onclick = () => {
        this._incFilter = el.dataset.f;
        if (el.dataset.f !== 'custom') { this._incCustomS = null; this._incCustomE = null; }
        this._renderIncomePanel(panel, txs);
      };
    });
    const ics = panel.querySelector('#ics'), ice = panel.querySelector('#ice');
    if (ics) ics.oninput = () => { this._incCustomS = ics.value; if (this._incCustomE) this._renderIncomePanel(panel, txs); };
    if (ice) ice.oninput = () => { this._incCustomE = ice.value; if (this._incCustomS) this._renderIncomePanel(panel, txs); };
  }

  async _goals(c){
    const txs=await this.db.all(S.TX);
    const goals=await this.db.all(S.GOALS);
    const now=new Date();

    if(!goals.length){
      const empty=this._card(' lilac-card');
      empty.innerHTML=`<div style="text-align:center;padding:20px">
        <div style="font-size:40px;margin-bottom:10px">💖</div>
